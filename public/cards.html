<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Analytics - Trading Card Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-50" data-page="cards">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-900 text-white flex-shrink-0">
            <!-- Sidebar auto-populated by sidebar-nav.js -->
        </aside>
        
        <main class="flex-1 overflow-auto">
            <div class="p-8">
                <div class="mb-6">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">
                        <i class="fas fa-th-large text-blue-500 mr-2"></i>Cards Analytics
                    </h1>
                    <p class="text-gray-600">Comprehensive investment intelligence for every card</p>
                </div>

                <!-- Advanced Metric Filters -->
                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <h3 class="font-semibold text-gray-900 mb-4">Intelligence Filters</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Search</label>
                            <input id="searchInput" type="text" placeholder="Card name..." class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Trend State</label>
                            <select id="trendStateFilter" class="w-full px-3 py-2 border rounded-lg">
                                <option value="">All Trends</option>
                                <option value="Rising">Rising</option>
                                <option value="Stable">Stable</option>
                                <option value="Declining">Declining</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Min Liquidity</label>
                            <input id="minLiquidityFilter" type="number" step="0.1" min="0" max="1" placeholder="0.0 - 1.0" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Min Opportunity Score</label>
                            <input id="minOpportunityFilter" type="number" min="0" max="100" placeholder="0 - 100" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Min Momentum</label>
                            <input id="minMomentumFilter" type="number" step="0.01" placeholder="-1.0 to 1.0" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Max Momentum</label>
                            <input id="maxMomentumFilter" type="number" step="0.01" placeholder="-1.0 to 1.0" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Sort By</label>
                            <select id="sortByFilter" class="w-full px-3 py-2 border rounded-lg">
                                <option value="opportunity_score">Opportunity Score</option>
                                <option value="momentum">Momentum</option>
                                <option value="liquidity_score">Liquidity</option>
                                <option value="loose_price">Price</option>
                            </select>
                        </div>
                        <div class="flex items-end gap-2">
                            <button id="applyFiltersBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Apply</button>
                            <button id="resetFiltersBtn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Reset</button>
                        </div>
                    </div>
                </div>

                <!-- Cards Table -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortBy('product_name')" title="Card details including player name, year, brand, card number, and parallel variation. Pulled from description in the cards table.">
                                        Card <i id="sort-icon-product_name" class="fas fa-sort ml-1 text-gray-400"></i>
                                    </th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortBy('loose_price')" title="Current raw (ungraded) market price. Calculation: Latest sale_price from card_sales where condition = 'ungraded'.">
                                        Price <i id="sort-icon-loose_price" class="fas fa-sort ml-1 text-gray-400"></i>
                                    </th>
                                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortBy('opportunity_score')" title="Composite card-level opportunity score (0-100). Step 1: Calculate grading premium multiple. Step 2: Weight by gem rate. Step 3: Weight by sales volume. Step 4: Normalize.">
                                        Opportunity <i id="sort-icon-opportunity_score" class="fas fa-sort-down ml-1 text-blue-600"></i>
                                    </th>
                                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortBy('trend_state')" title="Card-level price trend classification. Step 1: Calculate 30-day percentage price change. Step 2: Classify as Rising (>+5%), Declining (<-5%), or Stable.">
                                        Trend <i id="sort-icon-trend_state" class="fas fa-sort ml-1 text-gray-400"></i>
                                    </th>
                                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortBy('momentum')" title="7-day price momentum %. Step 1: Calculate 7-day price change. Step 2: Weight by transaction volume. Step 3: Express as percentage.">
                                        Momentum <i id="sort-icon-momentum" class="fas fa-sort ml-1 text-gray-400"></i>
                                    </th>
                                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortBy('liquidity_score')" title="Card liquidity rating (0-100). Step 1: Count transaction frequency in last 90 days. Step 2: Adjust for time-to-sell. Step 3: Higher = faster sales.">
                                        Liquidity <i id="sort-icon-liquidity_score" class="fas fa-sort ml-1 text-gray-400"></i>
                                    </th>
                                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortBy('volatility_regime')" title="Card risk score (0-100). Based on 90-day price volatility (standard deviation of daily average sale prices).">
                                        Risk <i id="sort-icon-volatility_regime" class="fas fa-sort ml-1 text-gray-400"></i>
                                    </th>
                                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider" title="Quick actions: View card detail, add to watchlist, or analyze further.">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="cardsTableBody" class="bg-white divide-y divide-gray-200">
                                <!-- Populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                    <div id="pagination" class="px-6 py-4 bg-gray-50 border-t flex items-center justify-between">
                        <!-- Pagination controls -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="loading" class="loading fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display: none;">
        <div class="bg-white rounded-lg p-6 flex items-center space-x-3">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <span>Loading cards...</span>
        </div>
    </div>

    <!-- Card Detail Off-canvas -->
    <div id="cardDetailOffcanvas" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black bg-opacity-50" onclick="closeCardDetail()"></div>
        <div class="absolute right-0 top-0 h-full w-[85%] bg-white shadow-2xl overflow-y-auto">
            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">Card Details</h2>
                    <button onclick="closeCardDetail()" class="p-2 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-times text-gray-500"></i>
                    </button>
                </div>
                <div id="offcanvasContent">
                    <!-- Card details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/js/sidebar-nav.js"></script>
    <script src="/js/cards-enhanced.js"></script>
</body>
</html>
