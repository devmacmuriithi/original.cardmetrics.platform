<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction vs BIN - Trading Card Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-50" data-page="sales-auction-vs-bin">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-900 text-white flex-shrink-0">
            <!-- Sidebar auto-populated by sidebar-nav.js -->
        </aside>

        <main class="flex-1 overflow-auto">
            <div class="p-8">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">
                        <i class="fas fa-gavel text-yellow-500 mr-2"></i>Auction vs BIN
                    </h1>
                    <p class="text-gray-600">Compare auction dynamics with buy-it-now pricing and velocity.</p>
                </div>

                <div id="decisionSignals" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-6 gap-4 mb-6"></div>

                <div id="kpiCards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-8"></div>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <div class="bg-white rounded-lg shadow p-6" title="Number of completed sales for each listing format (Auction vs BIN).">
                        <h3 class="text-lg font-semibold mb-4">Sales Count by Type</h3>
                        <div class="chart-container"><canvas id="chartCountByType"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Average sold price by listing format. Shows whether Auction or BIN realizes better prices.">
                        <h3 class="text-lg font-semibold mb-4">Avg Sale Price by Type</h3>
                        <div class="chart-container"><canvas id="chartAvgPriceByType"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Distribution of sale counts across price tiers, split by listing format.">
                        <h3 class="text-lg font-semibold mb-4">Price Buckets by Type</h3>
                        <div class="chart-container"><canvas id="chartPriceBucketsByType"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Average shipping costs by listing format. Useful for all-in cost comparisons.">
                        <h3 class="text-lg font-semibold mb-4">Shipping Cost by Type</h3>
                        <div class="chart-container"><canvas id="chartShippingByType"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Condition breakdown for each listing format. Helps validate inventory quality differences.">
                        <h3 class="text-lg font-semibold mb-4">Condition Mix by Type</h3>
                        <div class="chart-container"><canvas id="chartConditionByType"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Average seller ratings by listing format. Indicates trust quality differences.">
                        <h3 class="text-lg font-semibold mb-4">Seller Rating by Type</h3>
                        <div class="chart-container"><canvas id="chartRatingByType"></canvas></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/sidebar-nav.js"></script>
    <script src="/js/sales-decision-signals.js"></script>
    <script src="/js/sales-auction-vs-bin.js"></script>
</body>
</html>
