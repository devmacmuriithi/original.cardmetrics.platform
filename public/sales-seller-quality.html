<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Quality - Trading Card Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-50" data-page="sales-seller-quality">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-900 text-white flex-shrink-0">
            <!-- Sidebar auto-populated by sidebar-nav.js -->
        </aside>

        <main class="flex-1 overflow-auto">
            <div class="p-8">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">
                        <i class="fas fa-shield-alt text-purple-500 mr-2"></i>Seller Quality & Trust
                    </h1>
                    <p class="text-gray-600">Measure seller reliability, rating-driven pricing, and trust signals.</p>
                </div>

                <div id="decisionSignals" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-6 gap-4 mb-6"></div>

                <div id="kpiCards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-8"></div>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <div class="bg-white rounded-lg shadow p-6" title="Count of completed sales grouped by seller rating band. Indicates trust distribution in the market.">
                        <h3 class="text-lg font-semibold mb-4">Seller Rating Distribution</h3>
                        <div class="chart-container"><canvas id="chartRatingDistribution"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Average sale price for each seller rating band. Shows whether higher trust earns pricing premium.">
                        <h3 class="text-lg font-semibold mb-4">Avg Price by Rating Band</h3>
                        <div class="chart-container"><canvas id="chartAvgPriceByRating"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Average seller rating by marketplace platform. Useful for comparing platform trust quality.">
                        <h3 class="text-lg font-semibold mb-4">Platform Rating Averages</h3>
                        <div class="chart-container"><canvas id="chartPlatformRating"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Listing format composition inside each rating band. Helps assess execution style by seller quality.">
                        <h3 class="text-lg font-semibold mb-4">Listing Type by Rating</h3>
                        <div class="chart-container"><canvas id="chartListingTypeByRating"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Average shipping cost by seller rating band. Shows if trusted sellers charge different shipping levels.">
                        <h3 class="text-lg font-semibold mb-4">Shipping by Rating Band</h3>
                        <div class="chart-container"><canvas id="chartShippingByRating"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Total completed sales by rating band. Use this with pricing to evaluate trust-driven liquidity.">
                        <h3 class="text-lg font-semibold mb-4">Sales Count by Rating Band</h3>
                        <div class="chart-container"><canvas id="chartSalesByRating"></canvas></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/sidebar-nav.js"></script>
    <script src="/js/sales-decision-signals.js"></script>
    <script src="/js/sales-seller-quality.js"></script>
</body>
</html>
