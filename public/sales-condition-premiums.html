<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condition Premiums - Trading Card Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-50" data-page="sales-condition-premiums">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-900 text-white flex-shrink-0">
            <!-- Sidebar auto-populated by sidebar-nav.js -->
        </aside>

        <main class="flex-1 overflow-auto">
            <div class="p-8">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">
                        <i class="fas fa-certificate text-green-500 mr-2"></i>Condition Premiums
                    </h1>
                    <p class="text-gray-600">Identify the premium commanded by grade and condition labels.</p>
                </div>

                <div id="decisionSignals" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-6 gap-4 mb-6"></div>

                <div id="kpiCards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-8"></div>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <div class="bg-white rounded-lg shadow p-6" title="Average sale price for each condition/grade label. Highlights pricing premiums by condition.">
                        <h3 class="text-lg font-semibold mb-4">Avg Price by Condition</h3>
                        <div class="chart-container"><canvas id="chartAvgPriceByCondition"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Count of completed sales by condition. Shows which condition tiers are most liquid.">
                        <h3 class="text-lg font-semibold mb-4">Sales Count by Condition</h3>
                        <div class="chart-container"><canvas id="chartCountByCondition"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Platform distribution for each condition tier. Useful for channel-specific grade strategy.">
                        <h3 class="text-lg font-semibold mb-4">Platform Mix by Condition</h3>
                        <div class="chart-container"><canvas id="chartPlatformByCondition"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Auction/BIN mix by condition. Helps choose listing format for each condition tier.">
                        <h3 class="text-lg font-semibold mb-4">Listing Type by Condition</h3>
                        <div class="chart-container"><canvas id="chartListingTypeByCondition"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Average shipping cost for each condition tier. Shows how condition affects all-in buyer cost.">
                        <h3 class="text-lg font-semibold mb-4">Shipping by Condition</h3>
                        <div class="chart-container"><canvas id="chartShippingByCondition"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Price-tier distribution by condition. Useful for identifying which grades dominate each value band.">
                        <h3 class="text-lg font-semibold mb-4">Price Buckets by Condition</h3>
                        <div class="chart-container"><canvas id="chartPriceBucketsByCondition"></canvas></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/sidebar-nav.js"></script>
    <script src="/js/sales-decision-signals.js"></script>
    <script src="/js/sales-condition-premiums.js"></script>
</body>
</html>
