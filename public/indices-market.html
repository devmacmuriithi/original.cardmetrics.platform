<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Index - Trading Card Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-50" data-page="indices-market">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-900 text-white flex-shrink-0">
            <!-- Sidebar auto-populated by sidebar-nav.js -->
        </aside>

        <main class="flex-1 overflow-auto">
            <div class="p-8">
                <div class="mb-6">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">
                        <i class="fas fa-chart-area text-indigo-500 mr-2"></i>Market Index
                    </h1>
                    <p class="text-gray-600">Aggregate market performance from filtered sales baskets.</p>
                </div>

                <div id="indexFilters" class="bg-white rounded-lg shadow p-6 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Sport</label>
                            <select id="indexSport" class="w-full px-3 py-2 border rounded-lg">
                                <option value="">All Sports</option>
                                <option value="Basketball">Basketball</option>
                                <option value="Baseball">Baseball</option>
                                <option value="Football">Football</option>
                                <option value="Hockey">Hockey</option>
                                <option value="Soccer">Soccer</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Date From</label>
                            <input id="indexStartDate" type="date" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Date To</label>
                            <input id="indexEndDate" type="date" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Platform</label>
                            <select id="indexPlatform" class="w-full px-3 py-2 border rounded-lg">
                                <option value="">All Platforms</option>
                                <option value="eBay">eBay</option>
                                <option value="PWCC">PWCC</option>
                                <option value="Goldin">Goldin</option>
                                <option value="Heritage">Heritage</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Listing Type</label>
                            <select id="indexListingType" class="w-full px-3 py-2 border rounded-lg">
                                <option value="">All Types</option>
                                <option value="Auction">Auction</option>
                                <option value="Buy It Now">Buy It Now</option>
                                <option value="Best Offer">Best Offer</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Condition</label>
                            <select id="indexCondition" class="w-full px-3 py-2 border rounded-lg">
                                <option value="">All Conditions</option>
                                <option value="PSA 10">PSA 10</option>
                                <option value="PSA 9">PSA 9</option>
                                <option value="PSA 8">PSA 8</option>
                                <option value="BGS 10">BGS 10</option>
                                <option value="BGS 9.5">BGS 9.5</option>
                                <option value="BGS 9">BGS 9</option>
                                <option value="SGC 10">SGC 10</option>
                                <option value="SGC 9.5">SGC 9.5</option>
                                <option value="Raw">Raw</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Min Rating</label>
                            <input id="indexMinRating" type="number" step="0.1" placeholder="4.5" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Min Price</label>
                            <input id="indexMinPrice" type="number" placeholder="10" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Max Price</label>
                            <input id="indexMaxPrice" type="number" placeholder="1000" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Year From</label>
                            <input id="indexYearFrom" type="number" placeholder="2000" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Year To</label>
                            <input id="indexYearTo" type="number" placeholder="2024" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-3 mt-4">
                        <button id="applyIndexFilters" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Apply Filters</button>
                        <button id="resetIndexFilters" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg">Reset</button>
                    </div>
                </div>

                <div id="indexKpis" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-6 gap-4 mb-6"></div>

                <div id="indexInsights" class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6"></div>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">Index Value (Base 100)</h3>
                        <div class="chart-container"><canvas id="indexValueChart"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">Sales Volume</h3>
                        <div class="chart-container"><canvas id="indexVolumeChart"></canvas></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/sidebar-nav.js"></script>
    <script src="/js/indices-filters.js"></script>
    <script src="/js/indices-common.js"></script>
    <script src="/js/indices-market.js"></script>
</body>
</html>
