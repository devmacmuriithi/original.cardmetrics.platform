<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profiles - Trading Card Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-50" data-page="player-profiles">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-900 text-white flex-shrink-0">
            <!-- Sidebar auto-populated by sidebar-nav.js -->
        </aside>
        
        <main class="flex-1 overflow-auto">
            <div class="p-8">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">
                        <i class="fas fa-user-chart text-blue-500 mr-2"></i>Player Grading Profiles
                    </h1>
                    <p class="text-gray-600">Player-level grading statistics across all parallels</p>
                </div>

                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Search Player</label>
                            <input type="text" id="searchPlayer" placeholder="Enter player name..." 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Market Tier</label>
                            <select id="marketTier" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">All Tiers</option>
                                <option value="Superstar">Superstar</option>
                                <option value="Star">Star</option>
                                <option value="Starter">Starter</option>
                                <option value="Bench">Bench</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Grading Profile</label>
                            <select id="gradingProfile" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">All Profiles</option>
                                <option value="Extremely Difficult to Grade">Extremely Difficult</option>
                                <option value="Very Difficult to Grade">Very Difficult</option>
                                <option value="Difficult to Grade">Difficult</option>
                                <option value="Moderate to Grade">Moderate</option>
                                <option value="Easy to Grade">Easy</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Investment Rating</label>
                            <select id="investmentRating" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">All Ratings</option>
                                <option value="Premium Investment">Premium</option>
                                <option value="Good Investment">Good</option>
                                <option value="Liquid Asset">Liquid</option>
                                <option value="Speculative">Speculative</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-4 flex justify-between items-center">
                        <button onclick="applyFilters()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                            <i class="fas fa-filter mr-2"></i>Apply Filters
                        </button>
                        <button onclick="resetFilters()" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
                            <i class="fas fa-redo mr-2"></i>Reset
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <p class="text-sm text-gray-600">Showing <span id="resultCount" class="font-semibold">0</span> players</p>
                </div>

                <div id="dataContainer" class="bg-white rounded-lg shadow">
                    <div class="p-6 text-center text-gray-500">
                        <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
                        <p>Loading player profiles...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/sidebar-nav.js"></script>
    <script src="/js/ui-states.js"></script>
    <script src="/js/player-profiles.js"></script>
</body>
</html>
