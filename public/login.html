<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Card Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="h-full bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8 text-gray-900">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <!-- Brand Header matching Original Sidebar -->
        <div class="text-center">
            <div class="inline-flex items-center justify-center h-12 w-12 rounded-lg bg-gray-900 text-blue-400 mb-3 shadow">
                <i class="fas fa-chart-line text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">
                Card Analytics
            </h2>
            <p class="mt-1 text-sm text-gray-600">
                Sign in to access your platform dashboard
            </p>
        </div>

        <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-8 px-4 shadow-sm border border-gray-200 sm:rounded-lg sm:px-10">
                <!-- Error Alert -->
                <div id="error-alert" class="hidden mb-5 bg-red-50 border-l-4 border-red-500 p-3 text-sm text-red-700">
                    <div class="flex items-center">
                        <i class="fas fa-exclamation-circle mr-2 text-red-500"></i>
                        <span>Invalid username or password. Please try again.</span>
                    </div>
                </div>

                <form class="space-y-6" action="/login" method="POST">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700">
                            Username
                        </label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fas fa-user text-sm"></i>
                            </div>
                            <input id="username" name="username" type="text" required autofocus
                                value="admin"
                                class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2 border px-3"
                                placeholder="admin" />
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">
                            Password
                        </label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fas fa-lock text-sm"></i>
                            </div>
                            <input id="password" name="password" type="password" required
                                value="Admin@2026"
                                class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 pr-10 sm:text-sm border-gray-300 rounded-md py-2 border px-3"
                                placeholder="••••••••" />
                            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                <i id="eye-icon" class="fas fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <button type="submit"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150">
                            Sign in
                        </button>
                    </div>
                </form>

                <!-- Clean subtle credentials reminder -->
                <div class="mt-6 pt-4 border-t border-gray-100 text-xs text-gray-500 text-center">
                    Default access: <span class="font-mono text-gray-700 font-semibold">admin</span> / <span class="font-mono text-gray-700 font-semibold">Admin@2026</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'invalid') {
            document.getElementById('error-alert').classList.remove('hidden');
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
