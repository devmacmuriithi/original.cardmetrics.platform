<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Pulse - Trading Card Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-50" data-page="sales-pulse">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-900 text-white flex-shrink-0">
            <!-- Sidebar auto-populated by sidebar-nav.js -->
        </aside>

        <main class="flex-1 overflow-auto">
            <div class="p-8">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">
                        <i class="fas fa-bolt text-emerald-500 mr-2"></i>Sales Pulse
                    </h1>
                    <p class="text-gray-600">Live sales velocity, price momentum, and demand signals from card_sales.</p>
                </div>

                <div id="decisionSignals" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-6 gap-4 mb-6"></div>

                <div id="kpiCards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-8"></div>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <div class="bg-white rounded-lg shadow p-6" title="Daily count of completed sales in the selected period. Use this to see demand velocity and trend direction.">
                        <h3 class="text-lg font-semibold mb-4">Sales Volume (Last 30 Days)</h3>
                        <div class="chart-container"><canvas id="chartSalesByDay"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Daily dollar value of sold cards. Helps separate high activity from high revenue periods.">
                        <h3 class="text-lg font-semibold mb-4">Revenue Trend</h3>
                        <div class="chart-container"><canvas id="chartRevenueByDay"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Share of sales volume by marketplace platform. Use this to identify where demand is concentrated.">
                        <h3 class="text-lg font-semibold mb-4">Platform Share</h3>
                        <div class="chart-container"><canvas id="chartPlatformShare"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Breakdown of Auction vs BIN vs other listing formats. Useful for listing strategy decisions.">
                        <h3 class="text-lg font-semibold mb-4">Listing Type Mix</h3>
                        <div class="chart-container"><canvas id="chartListingType"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="How many sales occur in each price tier. Helps segment market depth by ticket size.">
                        <h3 class="text-lg font-semibold mb-4">Price Bucket Distribution</h3>
                        <div class="chart-container"><canvas id="chartPriceBuckets"></canvas></div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6" title="Distribution of sales import timestamps by hour. Useful for execution timing and monitoring cadence.">
                        <h3 class="text-lg font-semibold mb-4">Sales by Hour</h3>
                        <div class="chart-container"><canvas id="chartSalesByHour"></canvas></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/sidebar-nav.js"></script>
    <script src="/js/sales-decision-signals.js"></script>
    <script src="/js/sales-pulse.js"></script>
</body>
</html>
